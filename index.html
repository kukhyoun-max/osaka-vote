<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>오사카 음식투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
/* Layout: full-height vertical feed, one dish per screen, snap scrolling like reels. Single dark look by choice. */
:root{
  --ink:#141110;          /* page ground */
  --paper:#f6efe6;        /* primary text */
  --muted:#b9ada0;        /* secondary text */
  --line:rgba(246,239,230,.16);
  --like:#ff7a59;         /* 좋아요 */
  --meh:#e8c15a;          /* 보통 */
  --no:#5b6b8c;           /* 싫어요 */
  --chip:rgba(20,17,16,.55);
  --f-display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-glyph:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.inner{position:relative;z-index:2;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}

/* dish art */
.art{position:absolute;inset:0;z-index:0}
.art canvas{width:100%;height:100%;display:block}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(20,17,16,.55) 0%,rgba(20,17,16,0) 22%,rgba(20,17,16,0) 45%,rgba(20,17,16,.92) 82%)}

/* top progress */
.top{position:fixed;inset:0 0 auto;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px;pointer-events:none}
.top span{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .25s}
.top span.on{background:var(--paper)}
.top span.like{background:var(--like)}.top span.meh{background:var(--meh)}.top span.no{background:var(--no)}
.who{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 22px);left:max(16px,env(safe-area-inset-left,0px));font-size:16px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);color:var(--muted);pointer-events:none}

/* caption */
.slot{display:inline-flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:15px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--chip);border:1px solid var(--line);letter-spacing:.02em;backdrop-filter:blur(6px)}
.tag.res{border-color:var(--like);color:var(--like)}
.tag.walk{color:var(--muted)}
.place{font-size:14px;color:var(--muted);margin:0 0 2px}
.dish{font-family:var(--f-display);font-size:clamp(42px,11vw,58px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.dish .alias{display:block;font-family:var(--f-body);font-size:clamp(20px,5.5vw,26px);font-weight:800;color:var(--meh);margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ralias{font-weight:600;color:var(--muted);font-size:15px}
.desc{font-size:20px;line-height:1.55;font-weight:600;color:var(--paper);max-width:30ch;margin:0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.seepics{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:700 17px var(--f-body);color:var(--ink);background:var(--paper);border-radius:999px;padding:10px 16px;text-decoration:none}
.seepics:focus-visible{outline:2px solid var(--like);outline-offset:2px}
.wait{margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wait b{color:var(--paper);font-weight:600}

/* vote buttons, reels-style right rail */
.rail{position:relative;z-index:3;order:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 6px}
.vb{appearance:none;border:0;background:none;color:var(--paper);cursor:pointer;padding:0;min-width:0}
.vb .dot{height:96px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 22px var(--f-body);border:4px solid transparent;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s,border-color .2s,opacity .2s}
.vb[data-v="like"] .dot{background:var(--like);color:#fff}
.vb[data-v="meh"] .dot{background:var(--meh);color:#2a1d00}
.vb[data-v="no"] .dot{background:var(--no);color:#fff}
.rail.has-pick .vb:not(.sel) .dot{opacity:.45}
.vb.sel .dot{border-color:#fff;transform:scale(1.04)}
.vb svg{width:36px;height:36px}
.vb:active .dot{transform:scale(.9)}
.vb:focus-visible .dot{outline:2px solid var(--paper);outline-offset:3px}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}}
.dishcard .inner{order:2;padding-block:20px 14px}
.photo-btn{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 48px);right:max(16px,env(safe-area-inset-right,0px));font:700 14px var(--f-body);color:var(--ink);background:var(--paper);border-radius:999px;padding:10px 14px;cursor:pointer}
.photo-btn input{display:none}
.credit{position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 92px);max-width:60%;text-align:right;font-size:10px;line-height:1.35;color:var(--paper);opacity:.75;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.hint{position:relative;z-index:3;order:4;text-align:center;font-size:15px;color:var(--muted);padding-block:6px 14px}

/* start card */
.start{justify-content:center;background:radial-gradient(120% 80% at 70% 10%,#5a2a1c 0%,var(--ink) 60%)}
.start .inner{padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:520px}
.kicker{font-size:13px;letter-spacing:.12em;color:var(--like);font-weight:800}
.start h1{font-family:var(--f-display);font-size:clamp(40px,11vw,60px);line-height:1;margin:0}
.start p{margin:0;color:var(--paper);line-height:1.6;font-size:19px}
.legend{display:flex;gap:16px;font-size:17px;font-weight:700;color:var(--paper)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
label.lbl{font-size:18px;font-weight:700;color:var(--paper)}
.namebox{display:flex;gap:8px}
input[type=text],textarea{width:100%;min-width:0;background:rgba(246,239,230,.08);border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:14px;font:16px var(--f-body)}
input[type=text]:focus,textarea:focus{outline:2px solid var(--like);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{appearance:none;border:2px solid var(--line);background:transparent;color:var(--paper);border-radius:999px;padding:12px 20px;font:700 19px var(--f-body);cursor:pointer}
.chips button.on{background:var(--paper);color:var(--ink)}
.go{appearance:none;border:0;border-radius:14px;padding:18px;background:var(--like);color:#1b0f0b;font:800 21px var(--f-body);cursor:pointer}
.go:disabled{opacity:.4;cursor:default}
.go:focus-visible,.chips button:focus-visible,.ghost:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

/* result card */
.result{justify-content:flex-start;background:var(--ink)}
.result .inner{padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 40px);overflow-y:auto;height:100%;display:flex;flex-direction:column;gap:22px;max-width:640px;width:100%;margin:0 auto}
.result h2{font-family:var(--f-display);font-size:34px;margin:0}
.sub{color:var(--muted);font-size:16px;margin:4px 0 0;line-height:1.5}
.slotblock h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:800}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row .nm{font-weight:700;font-size:18px;min-width:0}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.row .sc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right}
.row .sc b{color:var(--paper);font-size:18px;margin-right:2px}
.bar{grid-column:1/-1;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.row.win .nm::before{content:attr(data-rank) "위";font-size:11px;font-weight:800;color:var(--ink);background:var(--like);border-radius:4px;padding:2px 5px;margin-right:6px;vertical-align:2px}
.voters{font-size:15px;color:var(--muted);grid-column:1/-1;line-height:1.5}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
.ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:12px;font:600 14px var(--f-body);cursor:pointer}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--meh)}
code.cd{display:block;font-size:12px;word-break:break-all;color:var(--muted);background:rgba(246,239,230,.06);padding:10px;border-radius:8px;user-select:all}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.feed{scroll-behavior:auto}}
</style>

</head>
<body>

/* ---------- build feed ---------- */
function build(){
  let h=`<section class="card start" id="c-start"><div class="inner">
    <div class="kicker">OSAKA · KYOTO 11.12–15</div>
    <h1>뭐 먹을까?</h1>
    <p>오사카·교토 대표 음식 17가지. 위로 넘기면서 버튼만 누르면 끝이에요. 가족 선호도 순위를 보고 가게를 정할게요.</p>
    <div class="legend"><span><i style="background:var(--like)"></i>좋아요</span><span><i style="background:var(--meh)"></i>보통</span><span><i style="background:var(--no)"></i>싫어요</span></div>
    <label class="lbl" for="name">누구세요?</label>
    <div class="chips" id="chips">${PRESETS.map(p=>`<button type="button" data-n="${p}">${p}</button>`).join("")}</div>
    <input type="text" id="name" placeholder="이름 직접 입력" maxlength="12" autocomplete="off">
    <button class="go" id="go" disabled>시작하기</button>
  </div></section>`;
  MENUS.forEach((m,i)=>{
    h+=`<section class="card dishcard" id="c-${m.id}" data-i="${i}">
      <div class="art"><canvas data-id="${m.id}"></canvas></div><div class="shade"></div>
      <div class="rail">${["like","meh","no"].map(v=>`<button class="vb" data-v="${v}" data-id="${m.id}" aria-label="${m.dish} ${LABEL[v]}"><span class="dot">${ICON[v]}${LABEL[v]}</span></button>`).join("")}</div>
      <div class="inner">
        <div class="slot"><span class="tag">${m.cat}</span><span class="tag walk">${i+1} / ${MENUS.length}</span></div>
        <h2 class="dish">${m.dish}${m.alias?`<span class="alias">${m.alias}</span>`:""}</h2>
        <p class="desc">${m.desc}</p>
        <a class="seepics" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(m.jp)}" target="_blank" rel="noopener">사진 더 보기 ↗</a>
      </div>
      <div class="hint">${i<MENUS.length-1?"위로 넘기면 다음 메뉴":"위로 넘기면 결과"}</div>
    </section>`;
  });
  h+=`<section class="card result" id="c-result"><div class="inner" id="resultInner"></div></section>`;
  feed.innerHTML=h;
  $("#prog").innerHTML=MENUS.map(m=>`<span data-id="${m.id}"></span>`).join("");
  document.querySelectorAll(".art canvas").forEach(paint);
}

/* generative dish art: warm lacquer gradient + brush kanji */
function paint(cv){
  const m=MENUS.find(x=>x.id===cv.dataset.id);
  const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  const w=Math.max(320,r.width||400),hh=Math.max(560,r.height||800);
  cv.width=w*d;cv.height=hh*d;const c=cv.getContext("2d");c.scale(d,d);
  const g=c.createLinearGradient(0,0,w,hh);
  g.addColorStop(0,`hsl(${m.hue[0]} 55% 34%)`);g.addColorStop(1,`hsl(${m.hue[1]} 45% 12%)`);
  c.fillStyle=g;c.fillRect(0,0,w,hh);
  // seigaiha-ish arcs
  c.strokeStyle="rgba(246,239,230,.05)";c.lineWidth=1.2;
  const s=46;for(let y=0;y<hh+s;y+=s/2)for(let x=(y/(s/2))%2?s/2:0;x<w+s;x+=s){for(let k=1;k<=3;k++){c.beginPath();c.arc(x,y,s/2*k/3,Math.PI,0);c.stroke()}}
  // sun disc
  const cx=w*.62,cy=hh*.34,rad=Math.min(w,hh)*.32;
  const rg=c.createRadialGradient(cx,cy,rad*.1,cx,cy,rad);
  rg.addColorStop(0,`hsla(${m.hue[0]} 80% 62% /.55)`);rg.addColorStop(1,`hsla(${m.hue[0]} 80% 50% /0)`);
  c.fillStyle=rg;c.beginPath();c.arc(cx,cy,rad,0,Math.PI*2);c.fill();
  c.fillStyle="rgba(246,239,230,.92)";c.textAlign="center";c.textBaseline="middle";
  c.font=`700 ${Math.min(w,hh)*.42}px "Zen Old Mincho","Hiragino Mincho ProN",serif`;
  c.fillText(m.glyph,cx,cy);
}

/* ---------- start ---------- */
function setName(n){
  S.name=n.trim();$("#go").disabled=!S.name;
  document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.dataset.n===S.name));
}
feed.addEventListener("click",e=>{
  const chip=e.target.closest("#chips button");
  if(chip){$("#name").value=chip.dataset.n;setName(chip.dataset.n);return}
  if(e.target.closest("#go")){begin();return}
  const vb=e.target.closest(".vb");if(vb){vote(vb.dataset.id,vb.dataset.v,vb);return}
});
feed.addEventListener("input",e=>{if(e.target.id==="name")setName(e.target.value)});
feed.addEventListener("keydown",e=>{if(e.target.id==="name"&&e.key==="Enter"&&S.name)begin()});

function begin(){
  store("dishvote.name",S.name);
  const saved=store("dishvote.picks."+S.name);
  S.picks=saved||(S.remote[keyOf(S.name)]?.picks)||{};
  $("#who").textContent=S.name+" 님 투표 중";$("#who").hidden=false;$("#prog").hidden=false;
  paintPicks();
  const next=MENUS.find(m=>!S.picks[m.id]);
  go(next?"#c-"+next.id:"#c-"+MENUS[0].id);
}
function go(sel){const el=$(sel);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}

/* ---------- vote ---------- */
function vote(id,v,btn){
  if(!S.name){go("#c-start");$("#name").focus();return}
  S.picks[id]=v;store("dishvote.picks."+S.name,S.picks);
  paintPicks();btn.querySelector(".dot").classList.remove("pop");void btn.offsetWidth;btn.querySelector(".dot").classList.add("pop");
  queueSave();
  const i=MENUS.findIndex(m=>m.id===id);
  setTimeout(()=>go(i<MENUS.length-1?"#c-"+MENUS[i+1].id:"#c-result"),380);
}
function paintPicks(){
  document.querySelectorAll(".vb").forEach(b=>b.classList.toggle("sel",S.picks[b.dataset.id]===b.dataset.v));
  document.querySelectorAll(".rail").forEach(r=>{const id=r.querySelector(".vb").dataset.id;r.classList.toggle("has-pick",!!S.picks[id])});
  document.querySelectorAll("#prog span").forEach(s=>{s.className=S.picks[s.dataset.id]||""});
  renderResult();
}

/* ---------- Google Sheet save (Apps Script web app) ---------- */
function queueSave(){S.dirty=true;clearTimeout(S.saveTimer);S.saveTimer=setTimeout(flush,700)}
async function flush(){
  if(!API||S.saving||!S.dirty||!S.name)return;
  S.saving=true;S.dirty=false;
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify({name:S.name,picks:S.picks})});
    const j=await r.json();S.dbOk=!!j.ok;
  }catch(e){S.dbOk=false;S.dirty=true}
  S.saving=false;renderResult();if(S.dirty&&S.dbOk!==false)flush();
}
async function loadVotes(){
  if(!API)return;
  try{
    const j=await (await fetch(API+"?t="+Date.now())).json();
    const m={};(j.votes||[]).forEach(v=>{if(v.name)m[keyOf(v.name)]=v});S.remote=m;S.dbOk=S.dbOk??true;
    if(S.name&&!Object.keys(S.picks).length&&m[keyOf(S.name)]){S.picks={...m[keyOf(S.name)].picks};paintPicks()}else renderResult();
  }catch(e){}
}

/* ---------- results ---------- */
function allVoters(){
  const map={...S.remote};
  if(S.name&&Object.keys(S.picks).length)map[keyOf(S.name)]={name:S.name,picks:S.picks};
  return Object.values(map);
}
function renderResult(){
  const box=$("#resultInner");if(!box)return;
  const voters=allVoters(),done=MENUS.filter(m=>S.picks[m.id]).length;
  let h=`<div><h2>가족 투표 결과</h2><p class="sub">${voters.length}명 참여 · 점수는 좋아요 2점, 보통 1점, 싫어요 0점${S.name?` · ${esc(S.name)} 님은 ${done}/${MENUS.length}개 골랐어요`:""}</p></div>`;
  if(!voters.length)h+=`<p class="empty">아직 투표가 없어요. 위로 올라가서 첫 번째로 골라주세요.</p>`;
  else{
    const rows=MENUS.map(m=>{
      const c={like:[],meh:[],no:[]};voters.forEach(v=>{const p=v.picks?.[m.id];if(c[p])c[p].push(v.name)});
      const tot=c.like.length+c.meh.length+c.no.length,score=c.like.length*2+c.meh.length;
      return{m,c,tot,score};
    }).sort((a,b)=>b.score-a.score||b.c.like.length-a.c.like.length||a.c.no.length-b.c.no.length);
    h+=`<div class="slotblock"><h3>선호도 순위</h3>`+rows.map((r,i)=>{
      const seg=v=>r.tot?`<span style="width:${r.c[v].length/r.tot*100}%;background:var(--${v})"></span>`:"";
      const who=["like","meh","no"].filter(v=>r.c[v].length).map(v=>`${LABEL[v]} ${r.c[v].map(esc).join(", ")}`).join(" · ");
      return `<div class="row${i<3&&r.score>0?" win":""}"><div class="nm" data-rank="${i+1}">${r.m.dish}${r.m.alias?` <span class="ralias">(${r.m.alias})</span>`:""}<small>${r.m.cat}</small></div>
        <div class="sc"><b>${r.score}</b>점</div><div class="bar">${seg("like")}${seg("meh")}${seg("no")}</div>
        ${who?`<div class="voters">${who}</div>`:""}</div>`;
    }).join("")+`</div>`;
  }
  const st=!API?`<span class="status">아직 저장소가 연결되지 않았어요. (설정 필요)</span>`
    :S.dbOk===true?`<span class="status ok">구글 시트에 저장됐어요. 가족 모두에게 같은 결과가 보여요.</span>`
    :S.dbOk===false?`<span class="status">저장에 실패했어요. 인터넷 연결을 확인하고 버튼을 다시 눌러주세요.</span>`
    :`<span class="status">고르면 자동으로 저장돼요.</span>`;
  h+=`<div class="box">${st}<button class="ghost" id="refresh">결과 새로고침</button></div>
  <button class="ghost" id="again">처음부터 다시 고르기</button>`;
  box.innerHTML=h;
}
document.addEventListener("click",e=>{
  if(e.target.id==="refresh"){if(S.dirty)flush();loadVotes()}
  if(e.target.id==="again"){go("#c-"+MENUS[0].id)}
});

/* ---------- photos ---------- */
const CREDITS={takoyaki:"와나카",okonomi:"미즈노",kushikatsu:"다루마",tempura:"마키노",cheesecake:"리쿠로오지상"};
function applyPhoto(id){
  const art=document.querySelector(`#c-${id} .art`);if(!art)return;
  const img=new Image();img.alt="";img.src=id+".jpg";img.onerror=()=>img.remove();art.appendChild(img);
  if(CREDITS[id]){const c=document.createElement("div");c.className="credit";c.textContent=CREDITS[id];art.parentNode.appendChild(c)}
}

/* ---------- boot ---------- */
build();
const last=store("dishvote.name");if(last){$("#name").value=last;setName(last)}
renderResult();
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>document.querySelectorAll(".art canvas").forEach(paint),200)});
document.fonts?.ready.then(()=>document.querySelectorAll(".art canvas").forEach(paint));

MENUS.forEach(m=>applyPhoto(m.id));
loadVotes();
setInterval(()=>{if(!document.hidden)loadVotes()},20000);
</script>
